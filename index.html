<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2023">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json?v=0.12.1">
<title>Angeli · Secretaria V0.12.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden}
body{background:#f4f4f2;color:#202124;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#1f2023;color:#fff;padding:18px 16px 17px}.brand{font-size:10px;letter-spacing:2.5px;font-weight:800;opacity:.65}
h1{font-size:25px;line-height:1.05;margin:5px 0 0}.version{font-size:10px;opacity:.55;margin-top:5px}
main{width:100%;max-width:720px;margin:auto;padding:12px 10px 30px}.panel{background:#fff;border:1px solid #dededb;border-radius:16px;padding:13px;margin-bottom:11px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.label{display:block;font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.7px;color:#666;margin:0 0 7px}
textarea{display:block;width:100%;min-height:112px;border:1px solid #d2d2cf;border-radius:12px;padding:13px;font:inherit;font-size:16px;line-height:1.45;resize:vertical;color:#202124}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.action{height:46px;border:0;border-radius:11px;font:inherit;font-weight:750;cursor:pointer;background:#202124;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}
.action.secondary{background:#f0f0ee;color:#202124;border:1px solid #d4d4d1}.action.danger{background:#fff;color:#333;border:1px solid #d4d4d1}.action.listening{background:#666}
.help{font-size:11px;color:#777;margin-top:7px;line-height:1.3}
.search input{width:100%;height:45px;border:1px solid #d4d4d1;border-radius:10px;padding:0 12px;font:inherit;font-size:15px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}.filter{height:40px;border:1px solid #d4d4d1;border-radius:10px;background:#fff;font:inherit;font-size:13px;cursor:pointer}.filter.active{background:#202124;color:#fff;border-color:#202124;font-weight:750}
.toast{position:fixed;left:12px;right:12px;bottom:18px;z-index:50;background:#202124;color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:650;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.22);opacity:0;transform:translateY(14px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
.card{background:#fff;border:1px solid #dededb;border-radius:13px;padding:12px;margin:8px 0}.meta{font-size:10px;color:#777;margin-bottom:6px;line-height:1.35;overflow-wrap:anywhere}.badge{font-weight:800;color:#333}.note-text{font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.card-media{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumb{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.file-line{font-size:11px;color:#555;margin-top:7px;overflow-wrap:anywhere}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:9px}.small-btn{border:1px solid #d4d4d1;border-radius:8px;background:#fff;padding:7px 9px;font:inherit;font-size:11px;cursor:pointer}
.done{opacity:.55}.done .note-text{text-decoration:line-through}.empty{text-align:center;color:#777;padding:30px 10px;font-size:13px}
@media(min-width:600px){main{padding:16px}.row{grid-template-columns:150px 100px 100px;justify-content:end}}
</style>
</head>
<body>
<header><div class="brand">ANGELI</div><h1>Secretaria</h1><div class="version">V0.12.1 · Teléfonos</div></header>
<main>
<section class="panel">
<label class="label">Bandeja de entrada</label>
<textarea id="text" placeholder="Escribe o dicta lo que quieras guardar…"></textarea>
<div class="row">
<button class="action" id="mic">🎙️ Dictar</button>
<button class="action danger" id="clear">🗑️ Borrar</button>
<button class="action" id="add">💾 Guardar</button>
</div>
<div class="row">
<label class="action secondary">📷 Cámara<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden></label>
<label class="action secondary">🖼️ Fotos<input id="photoInput" type="file" accept="image/*" multiple hidden></label>
<label class="action secondary">📎 Archivo<input id="fileInput" type="file" multiple hidden></label>
</div>
<div class="help" id="hint">Todo entra en la bandeja de entrada. La clasificación automática llegará cuando conectemos la IA.</div>
<div id="preview" class="card-media"></div>
</section>
<section class="panel">
<label class="label">Buscar</label><div class="search"><input id="search" placeholder="Buscar en tus entradas…"></div>
<label class="label" style="margin-top:12px">Mostrar</label><div class="filters"><button class="filter active" data-filter="all">Todas</button><button class="filter" data-filter="pending">Pendientes</button><button class="filter" data-filter="done">Hechas</button></div>
<label class="label" style="margin-top:12px">Tipo</label><div class="search"><select id="typeFilter"><option value="all">Todos los tipos</option><option value="note">Notas</option><option value="task">Tareas</option><option value="reminder">Recordatorios</option><option value="calendar">Calendario</option><option value="contact">Contactos</option><option value="photo">Fotos</option><option value="file">Archivos</option></select></div>
</section>
<section id="list"></section>
<section class="panel"><button class="small-btn" id="resetData">⚙️ Mantenimiento · Borrar todos los datos</button></section>
</main>
<div id="toast" class="toast"></div>
<script>
const KEY="angeli_secretaria_notes_v5";
const SHEETS_ENDPOINT="https://script.google.com/macros/s/AKfycbyyQ8VGgw45D-gRVnAmYs4nifEayZV1JhTc8u9ywtsMsqfJpHmwD8iL_AQFKJ1p5r-2WA/exec";
let notes=[],rec=null,listening=false,finalText="",pendingImages=[],pendingFiles=[],selectedFilter="all",selectedType="all",toastTimer;
const $=id=>document.getElementById(id);
function notify(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200)}
const MEDIA_DB="angeli_secretaria_media",MEDIA_STORES={images:"images",files:"files"};
function openMediaDB(){return new Promise((resolve,reject)=>{const request=indexedDB.open(MEDIA_DB,1);request.onupgradeneeded=()=>{const db=request.result;Object.values(MEDIA_STORES).forEach(store=>{if(!db.objectStoreNames.contains(store))db.createObjectStore(store,{keyPath:"id"})})};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function putMedia(store,record){const db=await openMediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(record);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function getMedia(store,id){const db=await openMediaDB();return new Promise((resolve,reject)=>{const request=db.transaction(store).objectStore(store).get(id);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function deleteMedia(store,id){const db=await openMediaDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
function deleteMediaDB(){return new Promise((resolve,reject)=>{const request=indexedDB.deleteDatabase(MEDIA_DB);request.onsuccess=()=>resolve();request.onerror=()=>reject(request.error);request.onblocked=()=>reject(new Error("La base de datos está en uso"))})}
async function migrateLegacyImages(){let changed=false;for(const note of notes){if(!note.images?.some(image=>typeof image==="string"&&image.startsWith("data:")))continue;const migrated=[];let complete=true;for(const image of note.images){if(!image.startsWith?.("data:")){migrated.push(image);continue}try{const blob=await fetch(image).then(response=>response.blob());const id=crypto.randomUUID();await putMedia(MEDIA_STORES.images,{id,blob,type:blob.type,size:blob.size});migrated.push(id)}catch(e){complete=false;break}}if(complete){note.images=migrated;changed=true}}if(changed)save(notes)}
function classify(text,images=[],files=[]){const value=(text||"").toLowerCase();if(/\b(mañana a las|cita|reunión|visita|apunta en el calendario)\b/.test(value))return"calendar";if(/\b(recuérdame|recordar)\b/.test(value))return"reminder";if(/\b(hacer|comprar|preparar|enviar|revisar)\b/.test(value))return"task";if(/\b(llama a|telefonear|contactar con)\b/.test(value))return"contact";if(images.length)return"photo";if(files.length)return"file";return"note"}
function typeLabel(type){return({note:"Nota",task:"Tarea",reminder:"Recordatorio",calendar:"Calendario",contact:"Contacto",file:"Archivo",photo:"Foto"})[type]||"Nota"}
function spokenPhone(text){const words={cero:"0",uno:"1",dos:"2",tres:"3",cuatro:"4",cinco:"5",seis:"6",siete:"7",ocho:"8",nueve:"9"},matches=(text.toLowerCase().match(/(?:(?:cero|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve)[\s,-]*){9,}/g)||[]);for(const match of matches){const number=(match.match(/cero|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve/g)||[]).map(word=>words[word]).join("");if(/^[6-9]\d{8}$/.test(number))return number}return""}
function actionData(text,type){const value=(text||"").toLowerCase(),data={},phone=value.match(/(?:\+34\s*)?([6-9](?:[\s-]?\d){8})\b/);const number=phone?phone[1].replace(/[\s-]/g,""):spokenPhone(value);if(number)data.phone=number;if(["task","reminder","calendar"].includes(type)){if(/\bmañana\b/.test(value)){const date=new Date();date.setDate(date.getDate()+1);data.scheduledDate=date.toISOString().slice(0,10)}else{const match=value.match(/\b(\d{2})\/(\d{2})\/(\d{4})\b/);if(match){const date=new Date(`${match[3]}-${match[2]}-${match[1]}T12:00:00`);if(!Number.isNaN(date.getTime()))data.scheduledDate=date.toISOString().slice(0,10)}}const time=value.match(/(?:a las\s+)([01]?\d|2[0-3])(?::([0-5]\d))?|\b([01]?\d|2[0-3]):([0-5]\d)\b/);if(time){const hour=time[1]||time[3],minute=time[2]||time[4]||"00";data.scheduledTime=`${hour.padStart(2,"0")}:${minute}`}}return data}
async function load(){try{notes=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){notes=[]}await migrateLegacyImages();let changed=false;notes=notes.map(note=>{const type=note.type||classify(note.text,note.images||[],note.files||[]),data=actionData(note.text,type);if(note.type&&(!data.phone||note.phone))return note;changed=true;return{...note,type,...data}});if(changed)save(notes);render()}
function save(nextNotes=notes){try{localStorage.setItem(KEY,JSON.stringify(nextNotes));notes=nextNotes;render();return true}catch(e){notify(e.name==="QuotaExceededError"?"No hay espacio para guardar la foto. Reduce o elimina entradas con imágenes.":"No se pudo guardar la entrada");return false}}
async function add(){
 const text=$("text").value.trim();
 if(!text&&!pendingImages.length&&!pendingFiles.length){notify("No hay nada que guardar");return}
 const now=new Date();const id=crypto.randomUUID();
 const images=[],files=[];
 try{for(const file of pendingImages){const mediaId=crypto.randomUUID();await putMedia(MEDIA_STORES.images,{id:mediaId,blob:file,type:file.type,size:file.size});images.push(mediaId)}for(const file of pendingFiles){const mediaId=crypto.randomUUID();await putMedia(MEDIA_STORES.files,{id:mediaId,blob:file,name:file.name,type:file.type,size:file.size});files.push({id:mediaId,name:file.name,type:file.type,size:file.size})}}catch(e){notify("No se pudieron guardar los archivos o imágenes");return}
 const type=classify(text,images,files),entry={id:id,date:now.toISOString(),text:text,status:"pending",type,...actionData(text,type),images,files};
 if(!save([entry,...notes])){try{await Promise.all([...images.map(id=>deleteMedia(MEDIA_STORES.images,id)),...files.map(file=>deleteMedia(MEDIA_STORES.files,file.id))])}catch(e){}return}
 $("text").value="";finalText="";pendingImages=[];pendingFiles=[];$("preview").innerHTML="";
 notify("Guardando en Google…");
 try{
   const payload={id:id,fecha:now.toLocaleDateString("es-ES"),hora:now.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}),entrada:text||"Entrada con archivo o imagen",estado:"Pendiente",tipo:entry.type,origen:"Angeli Secretaria V0.8",archivo:(entry.files||[]).map(f=>f.name).join(" · "),creadoPor:"Angeli Secretaria V0.8"};
   await fetch(SHEETS_ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
   notify("Entrada enviada a Google");
 }catch(e){notify("Guardada localmente · Google no respondió")}
}
function render(){document.querySelectorAll("img[data-object-url]").forEach(image=>URL.revokeObjectURL(image.dataset.objectUrl));
 const q=$("search").value.toLowerCase().trim();
 const arr=notes.filter(n=>(selectedFilter==="all"||n.status===selectedFilter)&&(selectedType==="all"||n.type===selectedType)&&(!q||(n.text+" "+(n.files||[]).map(f=>f.name).join(" ")).toLowerCase().includes(q)));
 $("list").innerHTML=arr.length?arr.map(n=>`<article class="card ${n.status==="done"?"done":""}">
 <div class="meta"><span class="badge">${typeLabel(n.type)}</span> · ${new Date(n.date).toLocaleDateString("es-ES")}</div>
 <div class="note-text">${esc(n.text||"Entrada con archivo o imagen")}</div>
 ${n.type==="task"?'<div class="meta">Tarea pendiente</div>':n.type==="reminder"?'<div class="meta">Recordatorio pendiente de programar</div>':""}
 ${n.images?.length?`<div class="card-media">${n.images.map(id=>`<img class="thumb" data-image-id="${id}" alt="">`).join("")}</div>`:""}
 ${n.files?.length?`<div class="file-line">📎 ${n.files.map(f=>f.id?`<button class="small-btn" data-a="open-file" data-id="${n.id}" data-media-id="${f.id}">${esc(f.name)}</button>`:esc(f.name||f)).join(" · ")}</div>`:""}
 ${n.type==="calendar"?'<div class="actions"><button class="small-btn" data-a="calendar" data-id="'+n.id+'">📅 Añadir al calendario</button></div>':""}
 ${n.type==="contact"?(n.phone?`<div class="actions"><a class="small-btn" href="tel:${n.phone}">📞 Llamar</a></div>`:`<div class="actions"><button class="small-btn" data-a="contact" data-id="${n.id}">📞 Llamar</button></div>`):""}
 <div class="actions"><button class="small-btn" data-a="toggle" data-id="${n.id}">${n.status==="done"?"Reabrir":"✓ Hecho"}</button><button class="small-btn" data-a="delete" data-id="${n.id}">Borrar</button></div>
 </article>`).join(""):'<div class="empty">No hay entradas.</div>';hydrateImages()
}
async function hydrateImages(){for(const image of document.querySelectorAll("img[data-image-id]")){try{const media=await getMedia(MEDIA_STORES.images,image.dataset.imageId);if(media){const url=URL.createObjectURL(media.blob);image.src=url;image.dataset.objectUrl=url}}catch(e){}}}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function stop(){listening=false;if(rec){try{rec.stop()}catch(e){}}rec=null;$("mic").classList.remove("listening");$("mic").textContent="🎙️ Dictar";$("hint").textContent="Dictado terminado. Pulsa «Guardar» cuando termines."}
function start(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){notify("Este navegador no admite dictado");return}
 if(listening){stop();return}
 finalText=$("text").value.trim();rec=new SR();rec.lang="es-ES";rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;
 let sessionFinal=finalText||"",lastInterim="";
 rec.onstart=()=>{listening=true;$("mic").classList.add("listening");$("mic").textContent="⏹️ Parar";$("hint").textContent="Escuchando…"};
 rec.onresult=e=>{
   let finalPart="",interimPart="";
   for(let i=e.resultIndex;i<e.results.length;i++){const result=e.results[i];const phrase=(result[0]?.transcript||"").trim();if(!phrase)continue;if(result.isFinal)finalPart+=(finalPart?" ":"")+phrase;else interimPart+=(interimPart?" ":"")+phrase}
   if(finalPart){sessionFinal+=(sessionFinal?" ":"")+finalPart;lastInterim=""}else lastInterim=interimPart;
   finalText=sessionFinal;$("text").value=(sessionFinal+(lastInterim?" "+lastInterim:"")).trim()
 };
 rec.onerror=e=>{listening=false;$("mic").classList.remove("listening");$("mic").textContent="🎙️ Dictar";$("hint").textContent="Dictado detenido.";notify(e.error==="not-allowed"?"Permiso de micrófono denegado":"Error de dictado: "+e.error)};
 rec.onend=()=>{finalText=sessionFinal;$("text").value=finalText;listening=false;$("mic").classList.remove("listening");$("mic").textContent="🎙️ Dictar";$("hint").textContent="Dictado terminado. Pulsa «Dictar» para continuar."};
 try{rec.start()}catch(e){listening=false;$("mic").classList.remove("listening");$("mic").textContent="🎙️ Dictar";notify("No se pudo iniciar el dictado")}
}
function readImages(files,msg){pendingImages=files;$("preview").innerHTML=pendingImages.map(file=>`<img class="thumb" src="${URL.createObjectURL(file)}" alt="">`).join("");notify(msg)}
$("mic").onclick=start;
$("clear").onclick=()=>{$("text").value="";finalText="";notify("Texto borrado")};
$("resetData").onclick=async()=>{if(!confirm("Se eliminarán todas las entradas, imágenes y archivos guardados solo en este dispositivo. Google Sheets no se modificará. ¿Continuar?"))return;try{await deleteMediaDB();localStorage.removeItem(KEY);notes=[];pendingImages=[];pendingFiles=[];$("text").value="";$("preview").innerHTML="";render();notify("Todos los datos locales han sido eliminados")}catch(e){notify("No se pudieron eliminar todos los datos locales")}};
$("add").onclick=add;
$("cameraInput").onchange=e=>{if(e.target.files.length)readImages([...e.target.files],"Foto preparada")};
$("photoInput").onchange=e=>{if(e.target.files.length)readImages([...e.target.files],"Imagen seleccionada")};
$("fileInput").onchange=e=>{pendingFiles=[...e.target.files];if(pendingFiles.length)notify("Archivo preparado")};
$("search").oninput=render;
$("typeFilter").onchange=e=>{selectedType=e.target.value;render()};
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{selectedFilter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});
$("list").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const n=notes.find(x=>x.id===b.dataset.id);if(!n)return;if(b.dataset.a==="calendar"){notify("Integración con calendario pendiente");return}if(b.dataset.a==="contact"){notify("No hay número de teléfono en esta entrada");return}if(b.dataset.a==="open-file"){try{const media=await getMedia(MEDIA_STORES.files,b.dataset.mediaId);if(!media)throw new Error();const url=URL.createObjectURL(media.blob);window.open(url,"_blank");setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){notify("No se pudo abrir el archivo")}return}if(b.dataset.a==="toggle"){n.status=n.status==="done"?"pending":"done";save();return}if(b.dataset.a==="delete"){const nextNotes=notes.filter(x=>x.id!==n.id);if(!save(nextNotes))return;try{for(const id of n.images||[])await deleteMedia(MEDIA_STORES.images,id);for(const file of n.files||[])if(file.id)await deleteMedia(MEDIA_STORES.files,file.id)}catch(e){notify("La entrada se borró, pero quedó algún medio sin eliminar")}}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js?v=0.12.1",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
load();
</script>
</body>
</html>
