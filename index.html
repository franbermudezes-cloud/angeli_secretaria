<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202124">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<title>Angeli · Secretaria</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden}
body{background:#f5f5f3;color:#202124;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#202124;color:#fff;padding:17px 16px 15px}
.small{font-size:10px;letter-spacing:2px;opacity:.65;font-weight:700}
h1{margin:3px 0 0;font-size:24px;line-height:1.1}
main{width:100%;max-width:700px;margin:auto;padding:10px}
.box{width:100%;background:#fff;border:1px solid #e1e1df;border-radius:14px;padding:10px;margin-bottom:10px}
textarea{display:block;width:100%;min-height:94px;border:1px solid #d5d5d3;border-radius:10px;padding:11px;font-size:16px;line-height:1.4;resize:vertical;outline:none}
.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;margin-top:8px}
.controls select{width:100%;min-width:0}
.buttons{display:grid;grid-template-columns:54px minmax(0,1fr);gap:7px;margin-top:7px}
select,input,button{width:100%;min-width:0;border:1px solid #d5d5d3;border-radius:9px;padding:10px;background:#fff;font-size:14px}
button{cursor:pointer}
#mic{background:#202124;color:#fff;border-color:#202124;font-size:18px}
#mic.listening{background:#777}
#add{background:#202124;color:#fff;border-color:#202124;font-weight:700}
.hint{font-size:11px;color:#777;margin-top:7px;line-height:1.3}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:7px}
.card{width:100%;background:#fff;border:1px solid #e2e2e0;border-radius:12px;padding:10px;margin:8px 0}
.meta{font-size:10px;color:#777;margin-bottom:5px;overflow-wrap:anywhere}
.badge{font-weight:700;color:#333}
.text{font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:7px}
.actions button{width:auto;font-size:11px;padding:6px 8px}
.done{opacity:.55}.done .text{text-decoration:line-through}
.empty{text-align:center;color:#777;padding:26px 10px;font-size:13px}

@media(max-width:480px){
  main{padding:8px}
  header{padding:16px 13px 14px}
  .box{padding:9px;border-radius:13px}
  .toolbar{grid-template-columns:1fr;gap:7px}
  .toolbar input,.toolbar select{width:100%;height:46px}
  .controls select{height:46px}
  .buttons button{height:48px}
}

@media(min-width:481px){
  .buttons{grid-template-columns:58px 90px;justify-content:end}
}
</style>
</head>
<body>
<header><div class="small">ANGELI</div><h1>Secretaria</h1></header>
<main>
<section class="box">
<textarea id="text" placeholder="Dime qué quieres apuntar…"></textarea>
<div class="controls">
<select id="type"><option value="idea">Idea</option><option value="pending">Pendiente</option><option value="decision">Decisión</option><option value="note">Nota</option></select>
<select id="area"><option value="general">General</option><option value="bodas">Bodas.net</option><option value="catalogo">Catálogo</option><option value="web">Web</option><option value="redes">Redes</option><option value="eventos">Angeli Eventos</option><option value="n8n">n8n</option><option value="imagenes">Imágenes</option></select>
</div>
<div class="buttons">
<button id="mic" title="Dictar">🎙️</button><button id="add">Añadir</button>
</div>
<div class="hint" id="hint">Pulsa el micrófono para dictar.</div>
</section>

<section class="box toolbar">
<input id="search" placeholder="Buscar notas…">
<select id="filter"><option value="all">Todo</option><option value="pending">Pendientes</option><option value="done">Hechas</option></select>
</section>

<section id="list"></section>
</main>

<script>
const KEY="angeli_secretaria_notes_v1";
let notes=[],rec=null,listening=false,finalText="";
const $=id=>document.getElementById(id);
function load(){notes=JSON.parse(localStorage.getItem(KEY)||"[]");render()}
function save(){localStorage.setItem(KEY,JSON.stringify(notes));render()}
function add(){const text=$("text").value.trim();if(!text)return;notes.unshift({id:crypto.randomUUID(),date:new Date().toISOString(),type:$("type").value,area:$("area").value,text,status:"pending"});$("text").value="";save()}
function render(){
 const q=$("search").value.toLowerCase().trim(),f=$("filter").value;
 const arr=notes.filter(n=>(f==="all"||n.status===f)&&(!q||(n.text+" "+n.area+" "+n.type).toLowerCase().includes(q)));
 $("list").innerHTML=arr.length?arr.map(n=>`<article class="card ${n.status==="done"?"done":""}">
 <div class="meta"><span class="badge">${label(n.type)}</span> · ${labelArea(n.area)} · ${new Date(n.date).toLocaleDateString("es-ES")}</div>
 <div class="text">${esc(n.text)}</div>
 <div class="actions"><button data-a="toggle" data-id="${n.id}">${n.status==="done"?"Reabrir":"Hecho"}</button><button data-a="delete" data-id="${n.id}">Borrar</button></div>
 </article>`).join(""):'<div class="empty">No hay notas.</div>';
}
function label(x){return ({idea:"Idea",pending:"Pendiente",decision:"Decisión",note:"Nota"})[x]||x}
function labelArea(x){return ({general:"General",bodas:"Bodas.net",catalogo:"Catálogo",web:"Web",redes:"Redes",eventos:"Angeli Eventos",n8n:"n8n",imagenes:"Imágenes"})[x]||x}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function stop(){listening=false;if(rec){try{rec.stop()}catch(e){}}rec=null;$("mic").classList.remove("listening");$("mic").textContent="🎙️";$("hint").textContent="Dictado terminado. Puedes editar el texto o pulsar Añadir."}
function start(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$("hint").textContent="Este navegador no admite dictado. Usa Chrome o Safari actualizado.";return}
 if(listening){stop();return}
 finalText=$("text").value.trim();rec=new SR();rec.lang="es-ES";rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
 rec.onstart=()=>{listening=true;$("mic").classList.add("listening");$("mic").textContent="⏹️";$("hint").textContent="Escuchando… pulsa otra vez para terminar."};
 rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=(finalText?" ":"")+t.trim();else interim+=t}$("text").value=(finalText+(interim?" "+interim:"")).trim()};
 rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")$("hint").textContent="Permiso de micrófono denegado.";else $("hint").textContent="Dictado detenido: "+e.error;stop()};
 rec.onend=()=>{if(listening){try{rec.start()}catch(e){}}};rec.start();
}
$("mic").onclick=start;$("add").onclick=add;$("search").oninput=render;$("filter").onchange=render;
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;const n=notes.find(x=>x.id===b.dataset.id);if(!n)return;if(b.dataset.a==="toggle")n.status=n.status==="done"?"pending":"done";else notes=notes.filter(x=>x.id!==n.id);save()};
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
load();
</script>
</body>
</html>
